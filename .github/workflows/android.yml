name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  # CI only checks the code (tests, build, lint, emulator smoke). It publishes no APKs.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug -Dorg.gradle.workers.max=4 --stacktrace 2>&1 | tee gradle-ci.log

      - name: Publish failure logs to ci-logs branch
        if: failure() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/cilogs
          cp gradle-ci.log /tmp/cilogs/ 2>/dev/null || true
          cp -r app/build/test-results /tmp/cilogs/ 2>/dev/null || true
          cd /tmp/cilogs
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "CI logs for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug -Dorg.gradle.workers.max=4 --stacktrace 2>&1 | tee gradle-lint.log

      - name: Publish failure logs to ci-logs branch
        if: failure() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/cilogs
          cp gradle-lint.log /tmp/cilogs/ 2>/dev/null || true
          cp app/build/reports/lint-results-debug.* /tmp/cilogs/ 2>/dev/null || true
          cd /tmp/cilogs
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "CI lint logs for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  # One status tag for the whole run (tests, APK and lint), read by the release scripts.
  status:
    needs: [build, lint]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish CI status ref
        run: |
          if [ "${{ needs.build.result }}" = success ] && [ "${{ needs.lint.result }}" = success ]; then st=success; else st=failure; fi
          git tag -f "ci-$st" "$GITHUB_SHA"
          git push -f origin "refs/tags/ci-$st"

  smoke:
    # Boots an emulator, opens the app, taps through it and screenshots it.
    # Builds its own APK so no APK leaves the runner. A flaky emulator never blocks the build job.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug -Dorg.gradle.workers.max=4 && mkdir -p apk && cp app/build/outputs/apk/debug/app-debug.apk apk/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator (API 34, Pixel 6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh com.olaph.xdm apk/app-debug.apk

      - name: Publish results to smoke branch
        if: always()
        run: |
          set -e
          [ -d smoke-out ] || { mkdir smoke-out; echo "FAIL emulator did not run" > smoke-out/result.txt; }
          printf 'ref=%s\nsha=%s\n' "$GITHUB_REF" "$GITHUB_SHA" > smoke-out/BUILD
          cd smoke-out
          git init -q -b smoke
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "smoke $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke
